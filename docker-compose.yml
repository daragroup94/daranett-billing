services:
  db:
    image: postgres:16-alpine
    container_name: daranett-db
    restart: always
    environment:
      POSTGRES_USER: daranett
      POSTGRES_PASSWORD: daranett123
      POSTGRES_DB: daranett_billing
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      my-net:
        ipv4_address: 100.204.0.60

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daranett-app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://daranett:daranett123@db:5432/daranett_billing?schema=public
      NODE_ENV: production
      TZ: Asia/Jakarta
    volumes:
      - ./backups:/app/backups
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      # HTTP Router → redirect ke HTTPS
      - "traefik.http.routers.daranett.entrypoints=web"
      - "traefik.http.routers.daranett.rule=Host(`billing.app.daragroup.cloud`)"
      - "traefik.http.middlewares.daranett-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.daranett-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.daranett.middlewares=daranett-https-redirect"
      # HTTPS Router
      - "traefik.http.routers.daranett-secure.entrypoints=websecure"
      - "traefik.http.routers.daranett-secure.rule=Host(`billing.app.daragroup.cloud`)"
      - "traefik.http.routers.daranett-secure.tls=true"
      - "traefik.http.routers.daranett-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.daranett-secure.service=daranett-service"
      # Loadbalancer Service Port
      - "traefik.http.services.daranett-service.loadbalancer.server.port=3000"
    networks:
      my-net:
        ipv4_address: 100.204.0.61
      traefik-proxy:

volumes:
  pgdata:
    driver: local

networks:
  my-net:
    external: true
    name: my-net
  traefik-proxy:
    external: true
    name: traefik-proxy
